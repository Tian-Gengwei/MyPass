  ######################################################################
  # 阶段 2：Android APK 构建（与桌面同时并行）
  #
  # 必须在 Ubuntu 上，配合 Android SDK + NDK；使用 Tauri 的
  # `cargo tauri android build`
  ######################################################################
  build-android:
    name: Build Android (APK)
    needs: [set-version]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_NDK_ROOT: /opt/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17 (Android build requires JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_API_LEVEL }},build-tools;34.0.0,ndk;${{ env.ANDROID_NDK_VERSION }},cmdline-tools;latest'

      - name: Verify NDK path
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"
          ls "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/"*"/bin/clang" 2>/dev/null || echo "clang not found yet"

      - name: Setup Rust ${{ env.RUST_VERSION }} + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo (Android)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri -> target
          cache-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # ============================================================
      # 前端构建（Android 需要同一份 frontend/dist）
      # ============================================================
      - name: Frontend — npm ci
        working-directory: frontend
        shell: bash
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Frontend — build
        working-directory: frontend
        shell: bash
        run: npm run build -- --logLevel warn

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install tauri-cli@^2.0 --locked --profile release \
            2>&1 | tail -n 30

      # ============================================================
      # 首次构建前需要 `tauri android init` 来生成 gen/android 脚手架。
      # 在 clean checkout 的机器上这是必需步骤，已存在时为幂等。
      # ============================================================
      - name: Tauri Android init
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -d "gen/android" ]; then
            echo "gen/android already exists, skipping init"
          else
            cargo tauri android init --ci
          fi

      # ============================================================
      # 为 Rust Android target 配置 NDK 工具链（让 cc / rustc 找到 clang）
      # ============================================================
      - name: Configure .cargo/config.toml for Android
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          ar     = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"
          ar     = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          ar     = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          [target.i686-linux-android]
          linker = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android${ANDROID_API_LEVEL}-clang"
          ar     = "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          # 加速后续 C 编译（避免 Android NDK 里重复调用系统 cc）
          [build]
          rustflags = ["-C", "strip=symbols"]
          EOF
          cat .cargo/config.toml

      # ============================================================
      # 执行 APK 构建（Tauri 内部会调用 cargo + gradle）
      # ============================================================
      - name: Build Android APK
        working-directory: src-tauri
        shell: bash
        run: |
          cargo tauri android build --apk --release \
            2>&1 | tail -n 100

      - name: List APK outputs
        shell: bash
        run: |
          echo "=== Android outputs ==="
          find src-tauri/target -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null
          find src-tauri/gen/android -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyPass-Android-APK-${{ needs.set-version.outputs.version }}
          path: |
            src-tauri/target/**/release/bundle/android/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 90

