          cp -R macos-aarch64/MyPass.app/Contents/Resources macos-universal/MyPass.app/Contents/
          cp -R macos-aarch64/MyPass.app/Contents/Info.plist macos-universal/MyPass.app/Contents/
          echo "Universal binary created"

      - name: 打包为 DMG
