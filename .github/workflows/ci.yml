name: CI

on:
  push:
    branches: [Dev1, main, develop]
  pull_request:
    branches: [Dev1, main, develop]
  workflow_dispatch:

# 避免重复的 CI 在同一个 PR 上跑多次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  NODE_VERSION: '24'
  RUST_VERSION: stable

jobs:
  # ============================================================
  # 前端 lint + 类型检查
  # ============================================================
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 构建前端
        working-directory: frontend
        run: npm run build

      - name: 上传前端 dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # Rust 格式 + clippy + 单元测试
  # ============================================================
  rust-lint:
    name: Rust Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: 'src-tauri -> target'

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --workspace --locked --lib --bins

  # ============================================================
  # Rust 跨平台编译检查
  # ============================================================
  rust-check:
    name: Rust Check (${{ matrix.os }})
    needs: rust-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deps: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: 'src-tauri -> target'
          cache-targets: ${{ matrix.target }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: ${{ matrix.deps }}

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 前端构建
        working-directory: frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: |
          cargo check --workspace --locked --target ${{ matrix.target }} --bins

  # ============================================================
  # 安全审计
  # ============================================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: rust-lint
    steps:
      - uses: actions/checkout@v4

      - name: RustSec Audit
        working-directory: src-tauri
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit --version "^0.21" || true
          cargo audit

      - name: npm Audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
