          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: 'src-tauri -> target'
          cache-targets: ${{ matrix.target }}

      - name: 前端构建
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: 准备 Android 项目
        working-directory: src-tauri
        run: |
          cargo tauri android init --ci --app-name "MyPass" --package-name "com.mypass.app" --target ${{ matrix.target }}

      - name: 配置 NDK 链接
        working-directory: src-tauri
        run: |
          # 在 .cargo/config.toml 中为 Android target 设置 NDK 工具链
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'

          [target.aarch64-linux-android]
          linker = "/root/Library/Android/sdk/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          ar = "/root/Library/Android/sdk/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

      - name: 构建 APK
        working-directory: src-tauri
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cargo tauri android build --apk --target ${{ matrix.target }}

